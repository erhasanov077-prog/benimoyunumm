name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Gerekli paketleri kur
        run: |
          sudo apt update
          sudo apt install -y git unzip zip openjdk-17-jdk

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          pip install cython==0.29.36
          pip install buildozer

      - name: APK oluştur
        run: |
          buildozer android debug

      - name: APK'yı kaydet
        uses: actions/upload-artifact@v4
        with:
          name: PiuCaniPiuBelli-APK
          path: bin/*.apk

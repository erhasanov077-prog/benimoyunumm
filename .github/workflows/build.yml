name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            ninja-build

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3"
          pip install buildozer

      - name: Check environment
        run: |
          python --version
          pip --version
          buildozer --version
          cython --version
          java -version

      - name: Build APK
        run: |
          buildozer -v android debug
        env:
          P4A_RELEASE_PLATFORMS: "armeabi-v7a,arm64-v8a"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TheHasanvFtbl-APK
          path: bin/*.apk
          if-no-files-found: error

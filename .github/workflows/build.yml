name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Python 3.9 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Sistem paketlerini kur
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            unzip \
            zip \
            openjdk-17-jdk \
            build-essential \
            libffi-dev \
            libssl-dev

      - name: Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install cython==0.29.36
          pip install buildozer

      - name: Dosyaları kontrol et
        run: |
          test -f main.py
          test -f buildozer.spec

      - name: Buildozer ile APK oluştur
        run: |
          buildozer android debug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: PiuCaniPiuBelli-APK
          path: bin/*.apk

name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Repository
        uses: actions/checkout@v4

      - name: Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Sistem paketleri
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            unzip \
            zip \
            openjdk-17-jdk \
            build-essential \
            libffi-dev \
            libssl-dev

      - name: Python paketleri
        run: |
          python -m pip install --upgrade pip
          pip install cython==0.29.36
          pip install buildozer

      - name: Buildozer Android SDK hazırlığı
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/cmdline-tools.zip

          mkdir -p /tmp/cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools

          mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools \
            $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest

          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

      - name: Android SDK ortamını ayarla
        run: |
          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/.buildozer/android/platform/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Buildozer
        run: |
          buildozer android debug

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: PiuCaniPiuBelli-APK
          path: bin/*.apk

name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Sistem paketlerini kur
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            unzip \
            zip \
            openjdk-17-jdk \
            build-essential \
            libffi-dev \
            libssl-dev

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          pip install cython==0.29.36
          pip install buildozer

      - name: buildozer.spec kontrolü
        run: |
          test -f buildozer.spec
          test -f main.py

      - name: Android SDK lisanslarını kabul et
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          yes | sdkmanager --licenses || true

      - name: Android SDK araçlarını kur
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: APK oluştur
        run: |
          buildozer android debug

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: PiuCaniPiuBelli-APK
          path: bin/*.apk

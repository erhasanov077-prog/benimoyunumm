name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Python 3.9 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Sistem paketlerini kur
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            unzip \
            zip \
            openjdk-17-jdk \
            build-essential \
            libffi-dev \
            libssl-dev

      - name: Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install cython==0.29.36
          pip install buildozer

      - name: buildozer.spec oluştur
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi

      - name: buildozer.spec ayarla
        run: |
          sed -i 's/^title = .*/title = PiuCaniPiuBelli/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = piucanipiubelli/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.alberto/' buildozer.spec
          sed -i 's/^source.dir = .*/source.dir = ./' buildozer.spec
          sed -i 's/^source.main = .*/source.main = main.py/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec
          sed -i 's/^fullscreen = .*/fullscreen = 1/' buildozer.spec

      - name: APK oluştur
        run: |
          buildozer android clean
          buildozer android debug

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: PiuCaniPiuBelli-APK
          path: bin/*.apk
